<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L1手机号码归属地批量查询</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --bg:#f4f6f9;--card:#fff;--line:#e6e9ef;--line2:#eef1f6;
  --text:#171a20;--text2:#6b7280;--text3:#9aa1ad;
  --brand:#2f6bff;--brand-d:#2258e0;--brand-bg:#eef3ff;
  --ok:#0f9d58;--ok-bg:#e9f8f0;--bad:#e5484d;--bad-bg:#fdecee;
  --warn:#b26a00;--warn-bg:#fdf6e5;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px -6px rgba(16,24,40,.08);
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
.mono{font-family:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}

.app{height:100%;display:flex;flex-direction:column;padding:16px 18px 14px;gap:14px;max-width:1560px;margin:0 auto}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:0 0 auto;animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(145deg,#3d76ff,#2258e0);
  display:grid;place-items:center;color:#fff;font-size:17px;
  box-shadow:0 4px 14px -4px rgba(47,107,255,.55);
}
h1{font-size:17px;font-weight:650;letter-spacing:-.2px}
.sub{font-size:12px;color:var(--text2);margin-top:1px}
.sub b{color:var(--brand);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:9px;box-shadow:var(--shadow)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(15,157,88,.13)}

/* ---------- 布局 ---------- */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:352px minmax(0,1fr);gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
.input-panel{animation-delay:.04s;overflow:hidden}
.result-panel{animation-delay:.1s;overflow:hidden}

/* ---------- 输入区 ---------- */
.phead{display:flex;align-items:center;justify-content:space-between;padding:13px 15px 9px}
.phead h2{font-size:13px;font-weight:600;color:var(--text)}
.pact{display:flex;gap:2px;margin-right:-6px}
.phead .tip{font-size:11.5px;color:var(--text3)}
textarea{
  flex:1;min-height:120px;resize:none;border:0;outline:0;background:transparent;
  padding:4px 15px 10px;font:13px/1.75 "SF Mono",ui-monospace,Consolas,monospace;
  color:var(--text);letter-spacing:.2px;
}
textarea::placeholder{color:#b7bdc8;font-family:inherit;letter-spacing:0;line-height:1.7}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px;border-top:1px solid var(--line2);background:#fafbfd}
.stat{text-align:center;padding:6px 4px;border-radius:9px;transition:background .2s}
.stat .v{font-size:17px;font-weight:680;letter-spacing:-.4px;font-variant-numeric:tabular-nums;transition:color .25s}
.stat .k{font-size:11px;color:var(--text2);margin-top:1px}
.stat.total .v{color:var(--text)}
.stat.bad .v{color:var(--bad)}
.stat.wait .v{color:#8b93a1}
.stat.ok .v{color:var(--ok)}

.ifoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 15px;height:38px;flex:0 0 auto;border-top:1px solid var(--line2)}
.note{font-size:11.5px;color:var(--text3);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note.has{color:var(--warn)}

/* ---------- 按钮 ---------- */
button{
  font:inherit;font-size:12.5px;color:var(--text);background:#fff;border:1px solid var(--line);
  padding:7px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:background .16s,border-color .16s,transform .1s,box-shadow .16s;white-space:nowrap;
}
button:hover{background:#f7f8fb;border-color:#d8dde6}
button:active{transform:scale(.965)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 8px -2px rgba(47,107,255,.5)}
button.primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
button.ghost{border-color:transparent;color:var(--text2);padding:5px 9px}
button.ghost:hover{background:#f2f4f8;color:var(--text)}
button svg{width:14px;height:14px;flex:0 0 auto}

/* ---------- 工具栏 ---------- */
.toolbar{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.spacer{flex:1}
.selinfo{font-size:12.5px;color:var(--text2);padding-left:2px;font-variant-numeric:tabular-nums}
.selinfo b{color:var(--brand);font-weight:650}
#btnClearFilter{padding:4px 9px;font-size:12px;color:var(--text2);border-color:var(--line)}
#btnClearFilter:hover{color:var(--bad);border-color:#f3c9cb;background:#fdf3f4}

.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);cursor:pointer;user-select:none}
input[type=checkbox]{
  appearance:none;width:16px;height:16px;border:1.5px solid #cbd2dd;border-radius:5px;
  background:#fff;cursor:pointer;position:relative;transition:background .15s,border-color .15s;flex:0 0 auto;
}
input[type=checkbox]:hover{border-color:#aab3c2}
input[type=checkbox]:checked{background:var(--brand);border-color:var(--brand)}
input[type=checkbox]:checked::after{
  content:"";position:absolute;left:4.6px;top:1.8px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg);
}
input[type=checkbox]:indeterminate{background:var(--brand);border-color:var(--brand)}
input[type=checkbox]:indeterminate::after{content:"";position:absolute;left:3px;top:6px;width:8px;height:2px;background:#fff;border-radius:1px}

.seg{display:inline-flex;background:#f1f3f7;border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:12.5px;color:var(--text2);box-shadow:none}
.seg button:hover{background:transparent;color:var(--text)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.1);font-weight:560}

/* ---------- 表格 ---------- */
.table-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.cols{display:grid;grid-template-columns:44px 54px 130px minmax(110px,1fr) 108px 88px;align-items:center}
.thead{padding:0 14px;height:38px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--text3);font-weight:500;flex:0 0 auto;background:#fcfcfe}
.thead .h{user-select:none}
.tbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 14px;scrollbar-gutter:stable}
.tbody::-webkit-scrollbar{width:9px}
.tbody::-webkit-scrollbar-thumb{background:#d5dae3;border-radius:9px;border:2px solid #fff}
.tbody::-webkit-scrollbar-thumb:hover{background:#c2c9d6}
#vspacer{position:relative;width:100%}
#vlist{position:absolute;left:0;right:0;top:0;will-change:transform}

.row{
  display:grid;grid-template-columns:44px 54px 130px minmax(110px,1fr) 108px 88px;align-items:center;
  height:44px;border-bottom:1px solid #f4f6fa;cursor:pointer;transition:background .13s;
}
.row:hover{background:#f8faff}
.row.sel{background:var(--brand-bg)}
.row.sel:hover{background:#e6eeff}
.row.anim{animation:fadeIn .3s ease both}
.idx{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.num{font-size:13.5px;font-weight:540;letter-spacing:.3px;font-family:"SF Mono",ui-monospace,Consolas,monospace}
.loc{font-size:12.8px;color:#3d4450;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.loc i{font-style:normal;color:#9aa3b2;margin-right:3px}
.car{font-size:12.2px;color:var(--text2);display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap}
.tg{font-style:normal;font-size:11px;line-height:1.5;padding:0 5px;border-radius:4px;font-weight:500;flex:0 0 auto}
.tg.mv{color:#b26a00;background:var(--warn-bg)}
.tg.no{color:var(--bad);background:var(--bad-bg)}
.st{font-size:12px;font-weight:560;padding:3px 9px;border-radius:6px;display:inline-block;text-align:center;min-width:52px}
.st.ok{color:var(--ok);background:var(--ok-bg)}
.st.bad{color:var(--bad);background:var(--bad-bg)}

.pfoot{flex:0 0 auto;padding:7px 14px 8px;border-top:1px solid #f6e2e3;font-size:11.5px;color:#d0343a;background:#fff8f8;line-height:1.55;text-wrap:pretty}

/* ---------- 表头控制 ---------- */
.hck{display:flex;align-items:center}
.hf{display:flex;align-items:center;gap:4px;cursor:pointer;border-radius:6px;padding:4px 7px;margin-left:-7px;transition:background .15s,color .15s;user-select:none;white-space:nowrap}
.hf:hover{background:#eaeff8;color:var(--text)}
.hf .chev{width:11px;height:11px;opacity:.36;flex:0 0 auto;transition:opacity .15s}
.hf.on{color:var(--brand);font-weight:560}
.hf.on .chev{opacity:.95}
.hf.open{background:#eaeff8;color:var(--text)}

/* ---------- 归属地面板 ---------- */
.fpop{
  position:fixed;z-index:80;width:292px;max-width:calc(100vw - 24px);max-height:430px;
  display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:0 14px 36px -10px rgba(16,24,40,.24),0 2px 6px rgba(16,24,40,.06);
  animation:popIn .13s ease-out;
}
@keyframes popIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.fpop[hidden]{display:none}
.fsearch{padding:10px;border-bottom:1px solid var(--line2)}
.fsearch input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;outline:0;transition:border-color .15s,box-shadow .15s}
.fsearch input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,255,.1)}
.flist{flex:1 1 auto;overflow-y:auto;padding:6px;min-height:0;scrollbar-gutter:stable}
.flist::-webkit-scrollbar{width:8px}
.flist::-webkit-scrollbar-thumb{background:#d5dae3;border-radius:8px;border:2px solid #fff}
.frow,.fcity{display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:7px;cursor:pointer;transition:background .12s}
.frow{height:34px}
.fcity{height:30px;padding-left:30px}
.frow:hover,.fcity:hover{background:#f5f7fb}
.fck{width:15px;height:15px;border:1.5px solid #cbd2dd;border-radius:4px;flex:0 0 auto;position:relative;background:#fff;transition:background .13s,border-color .13s}
.fck.c,.fck.p{background:var(--brand);border-color:var(--brand)}
.fck.c::after{content:"";position:absolute;left:4.2px;top:1.2px;width:4px;height:7.5px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
.fck.p::after{content:"";position:absolute;left:3px;top:5.4px;width:7px;height:2px;background:#fff;border-radius:1px}
.fname{flex:1;font-size:12.8px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcity .fname{color:#4a515e}
.fcnt{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.fexp{width:16px;text-align:center;color:#b0b7c3;font-size:15px;line-height:1;transition:transform .15s,color .15s}
.fexp.open{transform:rotate(90deg);color:var(--text2)}
.fempty{padding:26px 0;text-align:center;font-size:12.5px;color:var(--text3)}
.fgroup{font-size:11px;color:var(--text3);padding:9px 9px 3px;font-weight:500;letter-spacing:.3px}
.nrow{height:38px}
.nf{font-size:12.5px;font-family:"SF Mono",ui-monospace,Consolas,monospace;color:var(--text);letter-spacing:.2px}
.nl{font-size:11.5px;color:var(--text3);margin-left:auto;padding-left:10px;flex:0 0 auto}
.fmore{padding:9px;font-size:11.5px;color:var(--text3);text-align:center;line-height:1.4}
.ffoot{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-top:1px solid var(--line2);background:#fafbfd}
.fhint{font-size:11.5px;color:var(--text3)}
.dim{color:var(--text3);font-weight:400}
.ffoot button{font-size:12px;padding:5px 11px}


.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text3);padding:40px 20px;text-align:center}
.empty svg{width:46px;height:46px;opacity:.28}
.empty p{font-size:13px;line-height:1.7}
.empty p b{color:var(--text2);font-weight:560}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;top:22px;transform:translate(-50%,-16px);z-index:99;
  background:#171a20;color:#fff;font-size:13px;padding:9px 18px;border-radius:9px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  box-shadow:0 8px 26px -8px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .ic{color:#4ade80;font-size:14px}

@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

@media(max-width:1080px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .layout{grid-template-columns:1fr;grid-auto-rows:min-content}
  .input-panel{max-height:none}
  .input-panel textarea{height:156px;min-height:156px;flex:0 0 auto}
  .table-wrap{height:min(62vh,620px)}
}
@media(max-width:720px){
  .app{padding:12px}
  .topbar{flex-wrap:wrap}
  .badge{display:none}
  .cols,.row{grid-template-columns:40px 108px minmax(90px,1fr) 84px}
  .idx,.car{display:none}
  .thead .h.idx,.thead .h.car{display:none}
  .num{font-size:12.8px}
  .st{min-width:0;padding:3px 7px}
  .toolbar{gap:7px;padding:10px 11px}
  .selinfo{display:none}
  .seg button{padding:5px 9px}
  button{padding:7px 11px}
  #btnCopy,#btnExport{flex:1;justify-content:center}
  input[type=checkbox]{width:18px;height:18px}
  input[type=checkbox]:checked::after{left:5.2px;top:2px;width:4.5px;height:9px}
  input[type=checkbox]:indeterminate::after{left:3.4px;top:7px;width:9px}
  .hf{padding:5px 6px;margin-left:-6px;gap:3px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">◎</div>
      <div>
        <h1>L1手机号码归属地批量查询</h1>
        <p class="sub">号段库 <b id="dbCount">—</b> 条 · 覆盖 31 省 355 市 · 全本地运行</p>
      </div>
    </div>
    <div class="badge"><span class="dot"></span>离线模式 · 数据不出本机</div>
  </header>

  <main class="layout">
    <aside class="panel input-panel">
      <div class="phead">
        <h2>粘贴号码</h2>
        <div class="pact">
          <button class="ghost" id="btnSample">示例</button>
          <button class="ghost" id="btnClear">清空</button>
        </div>
      </div>
      <textarea id="input" spellcheck="false" placeholder="直接粘贴，自动识别

13800138000
139 1234 5678
+86-136-0000-1111

从 Excel、微信、文档里复制
整段文字也可以，会过滤噪音"></textarea>
      <div class="stats">
        <div class="stat total" id="sTotal"><div class="v">0</div><div class="k">号码数</div></div>
        <div class="stat ok" id="sOk"><div class="v">0</div><div class="k">可外呼</div></div>
        <div class="stat bad" id="sBad"><div class="v">0</div><div class="k">空号</div></div>
        <div class="stat wait" id="sWait"><div class="v">0</div><div class="k">不可外呼</div></div>
      </div>
      <div class="ifoot">
        <span class="note" id="note">支持换行、空格、逗号、+86 前缀</span>
      </div>
    </aside>

    <section class="panel result-panel">
      <div class="toolbar">
        <button id="btnInvert">反选</button>
        <span class="selinfo" id="selInfo">已选 <b>0</b> 条</span>
        <button id="btnClearFilter" hidden>清除筛选</button>
        <div class="spacer"></div>
        <button id="btnCopy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>
          复制选中
        </button>
        <button class="primary" id="btnExport">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v11m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          导出 Excel
        </button>
      </div>
      <div class="table-wrap">
        <div class="cols thead">
          <span class="h hck"><input type="checkbox" id="selAll" title="选中 / 取消筛选后的全部号码"></span>
          <span class="h idx">#</span>
          <span class="h hf" data-col="seg" title="按号段筛选"><span class="hl">号码</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 5.5h17l-6.6 7.6v5.4l-3.8 2v-7.4z"/></svg></span>
          <span class="h hf" data-col="loc" title="按归属地筛选"><span class="hl">归属地</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 5.5h17l-6.6 7.6v5.4l-3.8 2v-7.4z"/></svg></span>
          <span class="h hf car" data-col="car" title="按运营商筛选"><span class="hl">运营商</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 5.5h17l-6.6 7.6v5.4l-3.8 2v-7.4z"/></svg></span>
          <span class="h hf" data-col="state" title="按状态筛选"><span class="hl">是否空号</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 5.5h17l-6.6 7.6v5.4l-3.8 2v-7.4z"/></svg></span>
        </div>
        <div class="tbody" id="tbody"></div>
      </div>
      <div class="pfoot">「是否空号」依据号段库判定：号段不存在即为空号；标「否」只代表号段已分配，不代表机主在网。「可外呼」已排除物联 / 上网卡 / 卫星号段；虚拟运营商能打通但接通率低，建议单独判断。</div>
    </section>
  </main>
</div>
<div class="fpop" id="locPop" hidden>
  <div class="fsearch">
    <input type="text" id="locSearch" placeholder="搜索省份 / 城市" autocomplete="off" spellcheck="false">
  </div>
  <div class="flist" id="locList"></div>
  <div class="ffoot">
    <span class="fhint" id="locHint">未筛选</span>
    <button id="locClear">清除筛选</button>
  </div>

            for(k=0;k<len;k++){ dst[op]=dst[op-dd]; op++; }
          }
        }
      }
    }
    return op;
  };
})();

function buildDB(){
  var b64=atob(PHONE_DB.seg), cl=b64.length, i;
  var cb=new Uint8Array(cl);
  for(i=0;i<cl;i++) cb[i]=b64.charCodeAt(i);

  var rawLen=(cb[0]<<16)|(cb[1]<<8)|cb[2];
  var bytes=new Uint8Array(rawLen);
  if(inflate(cb,3,bytes)!==rawLen) throw new Error("号段库解压不完整");

  var co=new Uint16Array(SPAN), ca=new Uint8Array(SPAN);
  var p=0, prevEnd=BASE, gap, len, pc, start, ci, car, s, k, runs=0;
  function rv(){ var r=0,sh=0,b; for(;;){ b=bytes[p++]; r|=(b&0x7f)<<sh; if(b<0x80) break; sh+=7; } return r; }
  while(p<rawLen){
    gap=rv(); len=rv(); pc=rv();
    start=prevEnd+gap; ci=pc>>>3; car=pc&7;
    s=start-BASE;
    for(k=0;k<len;k++){ co[s+k]=ci+1; ca[s+k]=car; }
    prevEnd=start+len; runs++;
  }
  if(PHONE_DB.runCount && runs!==PHONE_DB.runCount) throw new Error("号段库校验失败("+runs+")");

  cityOf=co; carrierOf=ca;
  PROVS=PHONE_DB.prov.split("|");
  CITIES=PHONE_DB.city.split("|").map(function(c){
    return { p:c.charCodeAt(0)-65, n:c.slice(1) };
  });
}

var CARD=["其他","中国移动","中国联通","中国电信","中国电信","中国联通","中国移动","中国广电"];

/* 号码类型：依据工信部号段批文（虚拟运营商/上网卡/物联网/卫星），用于外呼适配判断 */
var USABLE_EXCLUDE = { iot:1, card:1, sat:1 };
var T_SAT={k:"sat",n:"卫星"}, T_MVNO={k:"mvno",n:"虚拟"}, T_CARD={k:"card",n:"上网卡"}, T_IOT={k:"iot",n:"物联"};
function segType(p7){
  var p3=(p7/10000)|0, p4=(p7/1000)|0, p5=(p7/100)|0;
  if(p4===1349||p4===1749||p4===1619) return T_SAT;
  if(p5>=17400 && p5<=17412) return T_SAT;
  if(p3===162||p3===165||p3===167||p3===170||p3===171) return T_MVNO;
  if(p3===145||p3===147||p3===149) return T_CARD;
  if(p3===146||p3===148||p3===172) return T_IOT;
  return null;
}

/* 查询：号段库命中=号码已分配；未命中=该号段不存在，必为空号 */
function query(num){
  var p7=+num.slice(0,7), k=p7-BASE;
  if(k>=0 && k<SPAN){
    var c=cityOf[k];
    if(c){
      var ct=CITIES[c-1], pv=PROVS[ct.p];
      var st=segType(p7);
      return { prov:pv, city:ct.n, loc:(pv===ct.n?pv:pv+ct.n), carrier:CARD[carrierOf[k]]||"其他",
               stk:st?st.k:"", stn:st?st.n:"", state:"ok" };
    }
  }
  return { prov:"—", city:"—", loc:"—", carrier:"—", stk:"", stn:"", state:"bad" };
}

/* ================= 号码提取 ================= */
/* 提取策略：先按强分隔符切成片段，再对短片段做贪心合并。
   这样既能认出「139 1234 5678」，又不会把两个号码跨空格拼成一个假号码。 */
var STRONG_SEP=/[,;|/\\\r\n\t!?()\[\]{}<>:"'`~@#$%^&*_+=.]/g;
var FULL_SEP=/[\uFF0C\u3001\uFF1B\uFF1A\uFF01\uFF1F\uFF08\uFF09\u3010\u3011\u300A\u300B\u201C\u201D\u2018\u2019\u3000]/g;

function ok11(x){ return x.length===11 && /^1[3-9]/.test(x); }

function extractNumbers(text){
  if(!text) return { list:[], odd:0 };

  var s=text
    .replace(/[\u200B-\u200F\uFEFF\u00AD]/g,"")
    .replace(/[\uFF10-\uFF19]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); })
    .replace(/[\uFF0B]/g,"+")
    .replace(/[\uFF0D\u2010-\u2015\u2212]/g,"-")
    .replace(FULL_SEP," ")
    .replace(STRONG_SEP," ");

  var raw=s.split(/\s+/), tokens=[], i, j, t, n;
  for(i=0;i<raw.length;i++){
    t=raw[i].replace(/[^0-9]/g,"");
    if(t) tokens.push(t);
  }
  n=tokens.length;

  var out=[];
  i=0;
  while(i<n){
    t=tokens[i];
    if(ok11(t)){ out.push(t); i++; continue; }

    if(t.length>11){
      if(t.length===13 && t.slice(0,2)==="86" && ok11(t.slice(2))){ out.push(t.slice(2)); i++; continue; }
      if(t.length===15 && t.slice(0,4)==="0086" && ok11(t.slice(4))){ out.push(t.slice(4)); i++; continue; }
      if(t.length===12 && t.charAt(0)==="0" && ok11(t.slice(1))){ out.push(t.slice(1)); i++; continue; }
      if(t.length>=22){
        var m=t.match(/1[3-9][0-9]{9}/g);
        if(m&&m.length){ for(j=0;j<m.length;j++) out.push(m[j]); i++; continue; }
      }
    }

    var acc=t, k=i+1;
    while(acc.length<11 && k<n){ acc+=tokens[k]; k++; }
    if(ok11(acc)){ out.push(acc); i=k; continue; }
    if(acc.length===13 && acc.slice(0,2)==="86" && ok11(acc.slice(2))){ out.push(acc.slice(2)); i=k; continue; }
    if(acc.length===12 && acc.charAt(0)==="0" && ok11(acc.slice(1))){ out.push(acc.slice(1)); i=k; continue; }
    i++;
  }

  var used=Object.create(null), odd=0;
  for(i=0;i<out.length;i++) used[out[i]]=1;
  for(i=0;i<n;i++){
    t=tokens[i];
    if(t.length>=9 && t.length<=12 && !used[t]) odd++;
  }
  return { list:out, odd:odd };
}

function dedupe(list){
  var seen=new Map(), out=[], i, n=list.length, d=0, v;
  for(i=0;i<n;i++){
    v=list[i];
    if(seen.has(v)) d++;
    else { seen.set(v,1); out.push(v); }
  }
  return { list:out, dup:d };
}

/* ================= 状态 ================= */
var ALL=[], VIEW=[], SEL=Object.create(null), lastRaw="";

var $=function(id){ return document.getElementById(id); };
var tbody=$("tbody"), input=$("input");

var MAX_NUM=300000, parseToken=0;

function parseNow(){
  var raw=input.value;
  if(raw===lastRaw) return;
  var myToken=++parseToken;

  var note=$("note");
  note.textContent="正在解析…";
  note.classList.add("has");

  requestAnimationFrame(function(){
    var r=extractNumbers(raw);
    var d=dedupe(r.list);
    var list=d.list, over=0;

    if(list.length>MAX_NUM){ over=list.length-MAX_NUM; list=list.slice(0,MAX_NUM); }

    if(list.length===ALL.length){
      var same=true;
      for(var q=0;q<list.length;q++){ if(list[q]!==ALL[q].num){ same=false; break; } }
      if(same){ lastRaw=raw; renderNote(r.odd,d.dup,over); return; }
    }
    lastRaw=raw;

    SEL=Object.create(null);
    F={ seg:{sel:{}}, loc:{sel:{}}, car:{sel:{}}, state:{sel:{}} };
    fKw=""; fExp={};
    closeFP();

    if(list.length<30000){
      var out=new Array(list.length), i, num, qq;
      for(i=0;i<list.length;i++){
        num=list[i]; qq=query(num);
        out[i]={ num:num, prov:qq.prov, city:qq.city, loc:qq.loc, carrier:qq.carrier,
                 stk:qq.stk, stn:qq.stn, state:qq.state };
      }
      ALL=out;
      buildLocTree(); updateHeads();
      renderNote(r.odd,d.dup,over);
      buildView();
      return;
    }

    var total=list.length, idx=0, CH=6000;
    var buf=new Array(total);

    (function step(){
      if(myToken!==parseToken) return;
      var end=Math.min(idx+CH,total);
      for(;idx<end;idx++){
        var n2=list[idx], q3=query(n2);
        buf[idx]={ num:n2, prov:q3.prov, city:q3.city, loc:q3.loc, carrier:q3.carrier,
                   stk:q3.stk, stn:q3.stn, state:q3.state };
      }
      if(idx<total){
        if(idx%30000===0){
          note.textContent="正在解析 "+idx.toLocaleString()+" / "+total.toLocaleString();
        }
        setTimeout(step,0);
      }else{
        ALL=buf;
        buildLocTree(); updateHeads();
        renderNote(r.odd,d.dup,over);
        buildView();
      }
    })();
  });
}

/* ================= 四列筛选 ================= */
var F={ seg:{sel:{}}, loc:{sel:{}}, car:{sel:{}}, state:{sel:{}} };
var curCol=null, fKw="", fExp={}, LOC_TREE=[];
var TNAME={ mvno:"虚拟运营商", iot:"物联网卡", card:"上网卡", sat:"卫星电话" };

function fN(col){ return Object.keys(F[col].sel).length; }
function viewSel(){ return VIEW.filter(function(r){ return SEL[r.num]; }); }
function viewSelN(){ var n=0,i; for(i=0;i<VIEW.length;i++) if(SEL[VIEW[i].num]) n++; return n; }
function anyFilter(){ return fN("seg")+fN("loc")+fN("car")+fN("state")>0; }

function segHit(r, sel){
  for(var k in sel){
    if(k.charAt(0)==="n"){ if(r.num===k.slice(2)) return true; }
    else if(r.num.slice(0,3)===k) return true;
  }
  return false;
}

function carHit(r, sel){
  for(var k in sel){
    if(k.charAt(0)==="o"){ if(r.carrier===k.slice(2)) return true; }
    else if(k.charAt(0)==="t"){ if(r.stk===k.slice(2)) return true; }
  }
  return false;
}

function buildLocTree(){
  var map=Object.create(null), order=[], i, r, p, c;
  for(i=0;i<ALL.length;i++){
    r=ALL[i];
    if(r.state!=="ok") continue;
    p=map[r.prov];
    if(!p){ p=map[r.prov]={prov:r.prov,count:0,cities:Object.create(null),corder:[]}; order.push(r.prov); }
    p.count++;
    c=p.cities[r.city];
    if(!c){ c=p.cities[r.city]={city:r.city,key:r.prov+"|"+r.city,count:0}; p.corder.push(r.city); }
    c.count++;
  }
  LOC_TREE=order.map(function(k){
    var q=map[k];
    return { prov:q.prov, count:q.count, cities:q.corder.map(function(cc){ return q.cities[cc]; }) };
  }).sort(function(a,b){ return b.count-a.count; });
}

function buildView(){
  var sSeg=F.seg.sel, sLoc=F.loc.sel, sCar=F.car.sel, sSt=F.state.sel;
  var nSeg=fN("seg"), nLoc=fN("loc"), nCar=fN("car"), nSt=fN("state");
  var list=ALL;

  if(nSeg||nLoc||nCar||nSt){
    list=ALL.filter(function(r){
      if(nSeg && !segHit(r,sSeg)) return false;
      if(nLoc && !sLoc[r.prov+"|"+r.city]) return false;
      if(nCar && !carHit(r,sCar)) return false;
      if(nSt && !sSt[r.state]) return false;
      return true;
    });
  }
  VIEW=list;
  updateStats();
  render();
}

function optionsFor(col){
  var map=Object.create(null), order=[], i, r;
  function add(key,label){
    if(!map[key]){ map[key]={key:key,label:label,count:0}; order.push(key); }
    map[key].count++;
  }
  if(col==="seg"){
    for(i=0;i<ALL.length;i++){ r=ALL[i]; add(r.num.slice(0,3), r.num.slice(0,3)); }
    return order.sort().map(function(k){ return map[k]; });
  }
  if(col==="state"){
    var okN=0, badN=0;
    for(i=0;i<ALL.length;i++){ if(ALL[i].state==="ok") okN++; else badN++; }
    var sl=[];
    if(okN) sl.push({ key:"ok",  label:"否（号段存在）", count:okN });
    if(badN) sl.push({ key:"bad", label:"是（空号）",     count:badN });
    return sl;
  }
  if(col==="car"){
    for(i=0;i<ALL.length;i++) add("o:"+ALL[i].carrier, ALL[i].carrier==="—"?"未知":ALL[i].carrier);
    var unk=null;
    if(map["o:—"]){ unk=map["o:—"]; delete map["o:—"]; order.splice(order.indexOf("o:—"),1); }
    var list=order.sort(function(a,b){ return map[b].count-map[a].count; }).map(function(k){ return map[k]; });
    if(unk) list.push(unk);
    var tm=Object.create(null);
    for(i=0;i<ALL.length;i++){ r=ALL[i]; if(r.stk) tm[r.stk]=(tm[r.stk]||0)+1; }
    ["mvno","iot","card","sat"].forEach(function(k){
      if(tm[k]) list.push({ key:"t:"+k, label:TNAME[k], count:tm[k], group:k==="mvno"?1:1 });
    });
    return list;
  }
  return [];
}

function renderFP(){
  var col=curCol;
  if(!col) return;
  var h=[], i, kw=fKw;
  var sel=F[col].sel;

  if(col==="loc"){
    for(i=0;i<LOC_TREE.length;i++){
      var p=LOC_TREE[i], cities=p.cities;
      var hitP = !kw || p.prov.indexOf(kw)>=0;
      var shown = hitP ? cities : cities.filter(function(c){ return c.city.indexOf(kw)>=0; });
      if(!shown.length) continue;
      var selN=0, cnt=0, j;
      for(j=0;j<cities.length;j++) if(sel[cities[j].key]) selN++;
      for(j=0;j<shown.length;j++) cnt+=shown[j].count;
      var allSel=selN===cities.length, partSel=selN>0&&!allSel;
      var exp=fExp[p.prov]||(kw&&!hitP);
      h.push('<div class="frow" data-p="'+p.prov+'"><span class="fck '+(allSel?'c':(partSel?'p':''))+'"></span>'+
        '<span class="fname">'+p.prov+'</span><span class="fcnt">'+cnt+'</span>'+
        '<span class="fexp'+(exp?' open':'')+'">›</span></div>');
      if(exp){
        for(j=0;j<shown.length;j++){
          h.push('<div class="fcity" data-c="'+shown[j].key+'"><span class="fck '+(sel[shown[j].key]?'c':'')+'"></span>'+
            '<span class="fname">'+shown[j].city+'</span><span class="fcnt">'+shown[j].count+'</span></div>');
        }
      }
    }
  } else if(col==="seg" && kw.length>=4 && /^[0-9]+$/.test(kw)){
    var hitN=0, k;
    for(k=0;k<ALL.length;k++){
      var rr=ALL[k];
      if(rr.num.indexOf(kw)<0) continue;
      hitN++;
      if(hitN<=300){
        h.push('<div class="frow nrow" data-k="n:'+rr.num+'"><span class="fck '+(sel["n:"+rr.num]?'c':'')+'"></span>'+
          '<span class="nf">'+rr.num+'</span><span class="nl">'+(rr.state==="ok"?rr.loc:"空号")+'</span></div>');
      }
    }
    if(!hitN) h.push('<div class="fempty">没有匹配的号码</div>');
    else if(hitN>300) h.push('<div class="fmore">还有 '+(hitN-300)+' 条未显示，请多输入几位</div>');
  } else {
    var opts=optionsFor(col);
    if(kw) opts=opts.filter(function(o){ return o.label.indexOf(kw)>=0; });
    var grpShown=false;
    for(i=0;i<opts.length;i++){
      var o=opts[i];
      if(o.key.charAt(0)==="t" && !grpShown){
        h.push('<div class="fgroup">号码类型</div>'); grpShown=true;
      }
      h.push('<div class="frow" data-k="'+o.key+'"><span class="fck '+(sel[o.key]?'c':'')+'"></span>'+
        '<span class="fname">'+o.label+'</span><span class="fcnt">'+o.count+'</span></div>');
    }
  }

  if(!h.length) h.push('<div class="fempty">没有匹配的选项</div>');
  $("locList").innerHTML=h.join("");

  var n=Object.keys(sel).length;
  $("locHint").textContent = n ? ("已选 "+n+" 项") : "未筛选";
  $("locSearch").placeholder = col==="seg" ? "输入号码或号段" : col==="loc" ? "搜索省份 / 城市" : col==="car" ? "搜索运营商" : "搜索状态";
  updateHeads();
}

function updateHeads(){
  var els=document.querySelectorAll(".hf");
  for(var i=0;i<els.length;i++){
    var el=els[i], c=el.dataset.col, n=fN(c);
    el.classList.toggle("on", n>0);
    var lab=el.querySelector(".hl");
    if(!el.dataset.base) el.dataset.base=lab.textContent;
    lab.textContent = n ? (el.dataset.base+" · "+n) : el.dataset.base;
  }
}

var fTimer=null;
function applyF(instant){
  renderFP();
  clearTimeout(fTimer);
  if(instant) buildView();
  else fTimer=setTimeout(buildView,130);
}

function toggleProv(prov){
  var p=null, i;
  for(i=0;i<LOC_TREE.length;i++) if(LOC_TREE[i].prov===prov){ p=LOC_TREE[i]; break; }
  if(!p) return;
  var sel=F.loc.sel, all=true;
  for(i=0;i<p.cities.length;i++) if(!sel[p.cities[i].key]){ all=false; break; }
  for(i=0;i<p.cities.length;i++){
    if(all) delete sel[p.cities[i].key]; else sel[p.cities[i].key]=1;
  }
  applyF(false);
}

function openFP(col, el){

/* ================= 渲染（虚拟滚动，只画可视区） ================= */
var ROW_H=44, OVER=8, vS=-1, vE=-1, rafPend=false;

function rowsHtml(s,e){

function paint(){

  if(!total) return;
  var st=tbody.scrollTop, hh=tbody.clientHeight||400;
  var s=Math.max(0, Math.floor(st/ROW_H)-OVER);
  var e=Math.min(total, Math.ceil((st+hh)/ROW_H)+OVER);
  if(s===vS && e===vE) return;
  vS=s; vE=e;
  var sp=document.getElementById("vspacer"), vl=document.getElementById("vlist");
  if(!sp||!vl) return;
  sp.style.height=(total*ROW_H)+"px";
  vl.style.transform="translateY("+(s*ROW_H)+"px)";
  vl.innerHTML=rowsHtml(s,e);
}

function updateStats(){
  var ok=0, bad=0, i, r;
  for(i=0;i<ALL.length;i++){
    r=ALL[i];
    if(r.state==="bad") bad++;
    else if(!USABLE_EXCLUDE[r.stk]) ok++;
  }
  var wait=ALL.length-ok-bad;
  if(wait<0) wait=0;
  setNum($("sTotal").querySelector(".v"), ALL.length, "t");
  setNum($("sOk").querySelector(".v"), ok, "o");
  setNum($("sBad").querySelector(".v"), bad, "b");
  setNum($("sWait").querySelector(".v"), wait, "w");
  var selCount=viewSelN();
  $("btnClearFilter").hidden = !anyFilter();
  var info="已选 <b>"+selCount+"</b> 条";
  if(VIEW.length!==ALL.length) info+='<span class="dim"> · 筛选后 '+VIEW.length+' 条</span>';
  $("selInfo").innerHTML=info;
  setBtnLabel($("btnCopy"), " 复制选中"+(selCount?"（"+selCount+"）":""));
  setBtnLabel($("btnExport"), " 导出 Excel"+(selCount?"（选中）":"（全部）"));
  var vsel=0, j;
  for(j=0;j<VIEW.length;j++){ if(SEL[VIEW[j].num]) vsel++; }
  var all=$("selAll");
  all.checked = VIEW.length>0 && vsel===VIEW.length;
  all.indeterminate = vsel>0 && vsel<VIEW.length;
}

/* ================= 复制 ================= */
function copyText(txt){
  var ta=document.createElement("textarea");
  ta.value=txt;
  ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;z-index:-1";
  document.body.appendChild(ta);
  ta.focus({ preventScroll:true });
  ta.select();
  ta.setSelectionRange(0, txt.length);
  var ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  if(!ok && navigator.clipboard){
    try{ navigator.clipboard.writeText(txt); ok=true; }catch(e){}
  }
  return ok;
}

  else toast("复制失败，请手动选择");

/* ================= 导出 XLSX ================= */
var CRC_TABLE=(function(){
  var t=new Uint32Array(256),c,i,k;
  for(i=0;i<256;i++){ c=i; for(k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[i]=c>>>0; }
  return t;
})();
function crc32(buf){
  var c=0xFFFFFFFF,i;
  for(i=0;i<buf.length;i++) c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function utf8(str){
  if(window.TextEncoder) return new TextEncoder().encode(str);
  var s=unescape(encodeURIComponent(str)), a=new Uint8Array(s.length), i;
  for(i=0;i<s.length;i++) a[i]=s.charCodeAt(i);
  return a;
}
function zip(files){
  var parts=[], central=[], offset=0, i, f, name, data, crc;
  function u16(n){ return [n&0xFF,(n>>8)&0xFF]; }
  function u32(n){ return [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF]; }
  for(i=0;i<files.length;i++){
    f=files[i]; name=utf8(f.name); data=f.data; crc=crc32(data);
    var lh=[].concat([0x50,0x4B,0x03,0x04],u16(20),u16(0),u16(0),u16(0),u16(0x21),
            u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    parts.push(new Uint8Array(lh),name,data);
    central.push({crc:crc,size:data.length,name:name,off:offset});
    offset+=lh.length+name.length+data.length;
  }
  var cd=[], cdSize=0;
  for(i=0;i<central.length;i++){
    f=central[i];
    var h=[].concat([0x50,0x4B,0x01,0x02],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0x21),
            u32(f.crc),u32(f.size),u32(f.size),u16(f.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(f.off));
    cd.push(new Uint8Array(h),f.name);
    cdSize+=h.length+f.name.length;
  }
  var eocd=[].concat([0x50,0x4B,0x05,0x06],u16(0),u16(0),u16(central.length),u16(central.length),
             u32(cdSize),u32(offset),u16(0));
  var all=parts.concat(cd,[new Uint8Array(eocd)]);
  var total=0,j;
  for(j=0;j<all.length;j++) total+=all[j].length;
  var out=new Uint8Array(total), pos=0;
  for(j=0;j<all.length;j++){ out.set(all[j],pos); pos+=all[j].length; }
  return out;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function colName(n){
  var s="";
  while(n>0){ var m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); }
  return s;
}

function buildXlsx(rows){
  var sd=[], i, r, cells, cors=["A","B","C","D","E","F"];
  var head=["序号","手机号码","归属地","运营商","号码类型","是否空号"];
  cells="";
  for(i=0;i<head.length;i++) cells+='<c r="'+cors[i]+'1" t="inlineStr" s="1"><is><t>'+esc(head[i])+'</t></is></c>';
  sd.push('<row r="1" ht="22" customHeight="1">'+cells+'</row>');
  var TYPE_NAME={ mvno:"虚拟运营商", iot:"物联网卡", card:"上网卡", sat:"卫星电话" };
  for(i=0;i<rows.length;i++){
    r=rows[i];
    var rn=i+2;
    var st=r.state==="ok"?"否":"是";
    var ty=r.state==="bad" ? "—" : (TYPE_NAME[r.stk]||"普通");
    sd.push('<row r="'+rn+'" ht="19" customHeight="1">'+
      '<c r="A'+rn+'" t="inlineStr"><is><t>'+(i+1)+'</t></is></c>'+
      '<c r="B'+rn+'" t="inlineStr"><is><t>'+esc(r.num)+'</t></is></c>'+
      '<c r="C'+rn+'" t="inlineStr"><is><t>'+esc(r.loc)+'</t></is></c>'+
      '<c r="D'+rn+'" t="inlineStr"><is><t>'+esc(r.carrier)+'</t></is></c>'+
      '<c r="E'+rn+'" t="inlineStr"><is><t>'+esc(ty)+'</t></is></c>'+
      '<c r="F'+rn+'" t="inlineStr"><is><t>'+esc(st)+'</t></is></c></row>');
  }
  var sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<cols><col min="1" max="1" width="7" customWidth="1"/><col min="2" max="2" width="18" customWidth="1"/>'+
    '<col min="3" max="3" width="18" customWidth="1"/><col min="4" max="4" width="13" customWidth="1"/>'+
    '<col min="5" max="5" width="13" customWidth="1"/><col min="6" max="6" width="12" customWidth="1"/></cols>'+
    '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'+
    '<sheetData>'+sd.join("")+'</sheetData></worksheet>';

  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
    '</Types>';

  var rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
    '</Relationships>';

  var wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<sheets><sheet name="号码核验" sheetId="1" r:id="rId1"/></sheets></workbook>';

  var wbr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'+
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
    '</Relationships>';

  var styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<fonts count="2"><font><sz val="11"/><name val="微软雅黑"/></font>'+
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="微软雅黑"/></font></fonts>'+
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+
    '<fill><patternFill patternType="solid"><fgColor rgb="FF2F6BFF"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1">'+
    '<alignment horizontal="center" vertical="center"/></xf></cellXfs>'+
    '<cellStyles count="1"><cellStyle name="常规" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  return zip([
    { name:"[Content_Types].xml", data:utf8(ct) },
    { name:"_rels/.rels", data:utf8(rels) },
    { name:"xl/workbook.xml", data:utf8(wb) },
    { name:"xl/_rels/workbook.xml.rels", data:utf8(wbr) },
    { name:"xl/styles.xml", data:utf8(styles) },
    { name:"xl/worksheets/sheet1.xml", data:utf8(sheet) }
  ]);
}
